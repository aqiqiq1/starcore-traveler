<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云海遗迹背景动态修复 DS03</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c1317; }
  body {
    display: flex; flex-direction: column; align-items: center;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #d9e6eb;
  }
  #stage {
    position: relative;
    width: min(640px, 100vw);
    margin: 0 auto;
    background: #0c1317;
  }
  @media (min-width: 1280px) {
    #stage { width: 1280px; }
  }
  canvas {
    display: block; width: 100%; height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #233d4c;
  }
  #hud {
    display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
    padding: 10px 12px;
    background: #0f1a1f;
    border-top: 1px solid #223740;
    font-size: 13px; line-height: 1.35;
  }
  #hud.hidden { display: none; }
  button {
    appearance: none; border: 1px solid #3b5560; border-radius: 5px;
    background: #17262d; color: #e3eff3; padding: 5px 9px;
    font: inherit; cursor: pointer;
  }
  button:hover { background: #20343d; border-color: #5e7f8c; }
  button.on { background: #2b5563; border-color: #7fb0bd; }
  #time { min-width: 118px; font-variant-numeric: tabular-nums; color: #a9c9d3; }
  #scrub { width: min(260px, 38vw); accent-color: #76aebc; }
  .sep { width: 1px; height: 22px; background: #34505b; margin: 0 2px; }
  #readout {
    margin-left: auto; color: #9dbfc9; font: 12px/1.4 ui-monospace, Consolas, monospace;
    white-space: pre; text-align: right;
  }
  #hint { width: 100%; color: #84a3ad; font-size: 12px; }
  #selftest { display: none; }
  @media (max-width: 820px) {
    #readout { margin-left: 0; width: 100%; text-align: left; }
    #hud { font-size: 12px; padding: 8px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="frame" width="1280" height="720" aria-label="云海遗迹动态背景预览，纯背景"></canvas>
  <div id="hud">
    <button id="play">暂停</button>
    <button id="reset">重置</button>
    <span id="time">t = 0.00 s</span>
    <input id="scrub" type="range" min="0" max="360" step="0.05" value="0" aria-label="时间">
    <span class="sep"></span>
    <button id="seamBefore">海面接缝前</button>
    <button id="seamAfter">海面接缝后</button>
    <button id="seamMark">接缝标记</button>
    <button id="skyWrap">天空云换边</button>
    <span class="sep"></span>
    <button id="bridgeUp" title="G1/G2 绝对静止复核时刻 A">桥静止检查A</button>
    <button id="bridgeDown" title="G1/G2 绝对静止复核时刻 B">桥静止检查B</button>
    <button id="bridgeJoint" title="两桥固定 offset 下的桥脚云遮挡检查">桥脚云遮挡</button>
    <button id="islandGap">右岛/桥间隙</button>
    <button id="g3g1Gap">G3/桥间隙</button>
    <button id="cloudToggle">关云检查</button>
    <button id="hideUI">隐藏控件</button>
    <div id="readout"></div>
    <div id="hint">纯背景 640×360 逻辑 / 1280×720 最近邻 device；天空与云海 +x 单向。两桥固定原 offset、不旋转/缩放；G3/G4/G5 仅 ±0.5 逻辑px 轻浮（周期 18/22/20 s）。“桥脚云遮挡”为真实时刻 t=64.47 s，桥底固定 300、G1 脚云顶 282。</div>
  </div>
</div>
<pre id="selftest"></pre>
<script src="config.js"></script>
<script src="preview.js"></script>
</body>
</html>
